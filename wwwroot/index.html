<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title></title>
    <link href="lib/bootstrap/dist/css/bootstrap.css" rel="stylesheet" />
    <link href="lib/font-awesome/css/all.css" rel="stylesheet" />
    <link href="css/site.css" rel="stylesheet" />
</head>
<body>
    <header>        
        <div class="container">
            <!-- Панель навигации -->
            <nav class="navbar navbar-expand-md">
                <!-- меню сайта -->
                <a class="navbar-brand" style="color: white" href="#">WebLabsV03</a>
                <div class="navbar-nav">
                    <a class="nav-item nav-link active" style="color: white" href="#">Лб 1</a>
                    <a class="nav-item nav-link" style="color: gray" href="#">Каталог</a>
                    <a class="nav-item nav-link" style="color: gray" href="#">Администрирование</a>
                </div>
                <!-- меню сайта - конец -->
                <!-- Информация пользователя -->
                <a href="#" class="navbar-text ms-auto">
                    00,0 руб <i class="fas fa-shopping-cart nav-color"></i> (0)
                </a>
                <div class="dropdown ms-4 nav-color">
                    <div class="dropdown-toggle" id="dropdownMenuButton"
                         data-bs-toggle="dropdown" aria-haspopup="true"
                         aria-expanded="false">
                        <img src="images/avatar.png" width="30"
                             alt="User" class="rounded" />
                    </div>
                    <div class="dropdown-menu"
                         aria-labelledby="dropdownMenuButton">
                        <div class="dropdown-item-text">
                            <img src="images/avatar.png" width="50" alt="User"
                                 class="rounded" />
                            user@mail.ru
                        </div>
                        <div class="dropdown-divider"></div>
                        <a class="dropdown-item" href="#">Мои товары</a>
                        <a class="dropdown-item" href="#">Выход</a>
                    </div>
                </div>
                <!-- Информация пользователя - конец -->
            </nav> <!-- Панель навигации - конец -->
        </div>
    </header>
    <main class="container">
        <h1>Лабораторная работа 1</h1>
        <div>
            <h1>Список</h1>
            <ol type="A" class="ms-4 fs-5">
                <li>элемент 1 списка</li>
                <li>элемент 2 списка</li>
            </ol>
            <hr />
        </div>

        <div>
            <h1>Форма</h1>
            <form method="post">
                <div style="margin-left: 220px;">
                    <input name="check1" type="checkbox" id="checkbox1" class="form-check-input"/>
                    <label for="checkbox1" class="form-check-label">Чек-бокс 1</label>

                    <br />

                    <input name="check2" type="checkbox" id="checkbox2" class="form-check-input"/>
                    <label for="checkbox2" class="form-check-label">Чек-бокс 2</label>
                </div>

                <br />

                <div style="margin-left: 220px;">
                    <input type="radio" id="radio1" name="radioButton" class="form-check-input" checked/>
                    <label for="radio1" class="form-check-label me-4">Радио-1</label>

                    <input type="radio" id="radio2" name="radioButton" class="form-check-input" />
                    <label for="radio2" class="form-check-label me-4">Радио-2</label>

                    <input type="radio" id="radio3" name="radioButton" class="form-check-input" />
                    <label for="radio3" class="form-check-label">Радио-3</label>
                </div>

                <br />

                <div>
                    <div class="form-group row">
                        <label for="inputLogin" class="col-sm-2 col-form-label">Логин:</label>
                        <div class="col-sm-10">
                            <input name="login" type="text" class="form-control" id="inputLogin" placeholder="Введите имя" autocomplete="off">
                        </div>
                    </div>

                    <div class="form-group row mt-3">
                        <label for="inputPassword" class="col-sm-2 col-form-label">Пароль:</label>
                        <div class="col-sm-10">
                            <input name="password" type="text" class="form-control" id="inputPassword" placeholder="Введите пароль" autocomplete="off">
                        </div>
                    </div>
                </div>

                <br />

                <input type="submit" class="btn btn-info text-white" value="Отправить"/>

            </form>
        </div>
    </main>
    <footer class="fixed-bottom">
        <div class="container">
            <div class="navbar navbar-expand-md">
                <div class="navbar-nav ms-auto">
                    <a class="nav-item nav-link" href="http://www.facebook.com">
                        <i class="fab fa-facebook-f fa-2x" style="color: gray"></i>
                    </a>
                    <a class="nav-item nav-link" href="http://www.vk.com">
                        <i class="fab fa-vk fa-2x" style="color: gray"></i>
                    </a>
                    <a class="nav-item nav-link" href="http://www.twitter.com">
                        <i class="fab fa-twitter fa-2x" style="color: gray"></i>
                    </a>
                </div>
            </div>
        </div>
    </footer>
    <script src="lib/jquery/dist/jquery.js"></script>
    <script src="lib/bootstrap/dist/js/bootstrap.bundle.js"></script> 
</body>
</html>
